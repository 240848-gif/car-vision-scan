name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_AI_API_KEY: ${{ secrets.EXPO_PUBLIC_AI_API_KEY }}
      EXPO_PUBLIC_AI_MODEL: gemini-3.6-flash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon > ../build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            a=$(grep -nE "What went wrong|error:|FAILED|Could not|Execution failed|Unsupported|requires|Caused by" -A3 ../build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle errors::$a"
            b=$(tail -25 ../build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=Gradle log tail::$b"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-vision-scan-apk
          path: android/app/build/outputs/apk/release/*.apk
